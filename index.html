<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Bottle 🍾</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="bottle-wrapper">
            <h1>✨ Message Bottle ✨</h1>
            <div class="bottle" id="bottle">
                <div class="bottle-cork"></div>
                <div class="bottle-body"></div>
                <div class="bottle-bottom"></div>
            </div>
            <p class="message-counter" id="messageCounter">0 messages waiting...</p>
            <button class="open-btn" id="openBtn">🏖️ Open Bottle 🏖️</button>
        </div>

        <div class="message-display" id="messageDisplay">
            <div class="message-box">
                <p class="message-text" id="messageText"></p>
                <p class="message-number" id="messageNumber"></p>
            </div>
            <button class="next-btn" id="nextBtn">Next Message →</button>
            <button class="close-btn" id="closeBtn">Close Bottle</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
